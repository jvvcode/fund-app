[project]
name = "fundapp"
version = "0.1.0"
description = "Family fund management application"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "pyarrow>=15",
  "apscheduler>=3.10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pandas-market-calendars>=4.4",
  "alembic>=1.13",
]

[project.optional-dependencies]
analytics = ["PyPortfolioOpt>=1.5", "riskfolio-lib>=6.0", "quantstats>=0.0.62", "scipy>=1.12", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.4", "black>=24.3", "pre-commit>=3.7", "jupyterlab>=4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundapp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
